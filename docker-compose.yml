services:
  postgres:
    image: postgres:16-alpine
    container_name: shinso-pos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shinso
      POSTGRES_PASSWORD: shinso
      POSTGRES_DB: shinso
    volumes:
      - shinso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinso -d shinso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shinso_pgdata:
